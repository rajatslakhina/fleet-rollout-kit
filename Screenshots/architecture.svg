<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="SF Mono, Menlo, monospace">
  <rect width="980" height="620" fill="#0f1117"/>
  <text x="34" y="46" fill="#e6e9ef" font-size="21" font-weight="700">FleetRollout &#8212; a fleet-targeting remote config, client half</text>
  <text x="34" y="72" fill="#7d8799" font-size="13">Identity-based train targeting, a version floor a kill cannot be undone across, deterministic bucketing.</text>

  <rect x="34" y="104" width="220" height="90" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="50" y="130" fill="#8ab4f8" font-size="14" font-weight="700">BuildTrain</text>
  <text x="50" y="152" fill="#9aa4b8" font-size="12">identity, not a number</text>
  <text x="50" y="172" fill="#9aa4b8" font-size="12">DeviceContext &#183; no ordering op</text>

  <rect x="34" y="216" width="220" height="76" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="50" y="242" fill="#8ab4f8" font-size="14" font-weight="700">TargetingPredicate</text>
  <text x="50" y="264" fill="#9aa4b8" font-size="12">onTrain(Set) &#183; depth-bounded</text>
  <text x="50" y="282" fill="#9aa4b8" font-size="12">no &gt;= over trains &#8212; inexpressible</text>

  <path d="M254 149 L316 149" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M144 194 L144 216" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M254 254 L316 200" stroke="#4a5570" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#tip)"/>

  <rect x="316" y="104" width="240" height="120" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="332" y="130" fill="#8ab4f8" font-size="14" font-weight="700">Evaluator</text>
  <text x="332" y="154" fill="#c9d1e0" font-size="12">killed &gt; rule match &gt; default</text>
  <text x="332" y="176" fill="#c9d1e0" font-size="12">StableBucketer (FNV-1a/64)</text>
  <text x="344" y="193" fill="#7d8799" font-size="11">10,000 basis points, specified</text>
  <text x="332" y="212" fill="#f2b880" font-size="12">Assignment &#8212; carries its reason</text>

  <path d="M556 164 L618 164" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>

  <rect x="618" y="104" width="230" height="120" rx="8" fill="#1a2130" stroke="#4d7fd6"/>
  <text x="634" y="130" fill="#8ab4f8" font-size="14" font-weight="700">ConfigStore &#8212; actor</text>
  <text x="634" y="152" fill="#c9d1e0" font-size="12">stale-while-revalidate</text>
  <text x="634" y="172" fill="#c9d1e0" font-size="12">MonotonicVersionFloorPolicy</text>
  <text x="646" y="189" fill="#7d8799" font-size="11">never below the accepted floor</text>
  <text x="634" y="208" fill="#c9d1e0" font-size="12">warmUp(budget:) &#8212; spent, not extended</text>

  <path d="M733 224 L733 268" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>

  <rect x="500" y="268" width="348" height="96" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="516" y="294" fill="#8ab4f8" font-size="14" font-weight="700">DocumentValidator</text>
  <text x="516" y="316" fill="#9aa4b8" font-size="12">13 structural defects &#8212; fatal vs. warning</text>
  <text x="516" y="336" fill="#9aa4b8" font-size="12">empty group, shared salt, inverted range</text>
  <text x="516" y="352" fill="#f2b880" font-size="12">runs before a document is ever trusted</text>

  <path d="M500 316 L440 316" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>
  <rect x="270" y="288" width="170" height="56" rx="8" fill="#1b1620" stroke="#7a5a86" stroke-dasharray="5 4"/>
  <text x="286" y="312" fill="#c79ad6" font-size="13" font-weight="700">ExposureLog</text>
  <text x="286" y="332" fill="#8b8296" font-size="11">bounded, deduping ring</text>

  <rect x="34" y="400" width="380" height="118" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="50" y="426" fill="#8ab4f8" font-size="14" font-weight="700">FleetSimulator &#183; SplitMix64</text>
  <text x="50" y="450" fill="#7fc9a0" font-size="12">reproducible synthetic fleet, seeded</text>
  <text x="50" y="472" fill="#9aa4b8" font-size="12">forkedSeptember2026 &#8212; the real 27.1/27.2 split</text>
  <text x="50" y="494" fill="#7d8799" font-size="11">runs the real Evaluator over every device</text>

  <rect x="442" y="400" width="380" height="118" rx="8" fill="#161a23" stroke="#39415a"/>
  <text x="458" y="426" fill="#8ab4f8" font-size="14" font-weight="700">PropagationSimulator</text>
  <text x="458" y="450" fill="#9aa4b8" font-size="12">4 channels &#8212; 2 guaranteed, 2 best-effort</text>
  <text x="458" y="472" fill="#e08d7a" font-size="12">neither set meets 95% in 15 min</text>
  <text x="458" y="494" fill="#7d8799" font-size="11">a kill switch&#8217;s SLO is bounded by engagement</text>

  <path d="M224 364 L224 400" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>
  <path d="M632 364 L632 400" stroke="#4a5570" stroke-width="2" marker-end="url(#tip)"/>

  <rect x="34" y="538" width="788" height="46" rx="8" fill="#1a2130" stroke="#4d7fd6"/>
  <text x="50" y="566" fill="#8ab4f8" font-size="13" font-weight="700">FleetRolloutUI</text>
  <text x="164" y="566" fill="#9aa4b8" font-size="12">SwiftUI dashboard &#8212; driven entirely by the real evaluator and simulator, no fixtures</text>

  <text x="34" y="606" fill="#5c657a" font-size="12">github.com/rajatslakhina/fleet-rollout-kit</text>

  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0 0 L9 4 L0 8 z" fill="#4a5570"/>
    </marker>
  </defs>
</svg>
